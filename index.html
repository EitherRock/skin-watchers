<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE PLATFORM</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="layout">

    <!-- LEFT: ADS / RELATED STREAMS -->
    <div id="left-panel">

        <div class="panel-title">RELATED STREAMS AND ADS</div>

    
        <!-- RELATED STREAMS -->
        <div id="related-streams">
            <div class="ad">🔴 Abandoned House Cam</div>
            <div class="ad">🔴 Basement Feed #2</div>
            <div class="ad">🔴 Night Vision Corridor</div>
            <!-- <div class="ad">🔴 Static Channel 11</div> -->
            <div class="ad">🔴 Lost in the Woods</div>
            <div class="ad">🔴 Asylum Hallway</div>
            <div class="ad">🔴 Jefferson's Tree House</div>
        </div>

         <!-- ROTATING ADS -->
        <div id="ad-carousel">
            <img class="ad-slide active" src="images/ads/dating.png" alt="Cryptid Dating Site">
            <img class="ad-slide" src="images/ads/repellent.png" alt="Yeti repellent">
            <img class="ad-slide" src="images/ads/treetrimming.png" alt="Tree Trimmimg">
            <!-- <img class="ad-slide" src="images/ad4.png" alt="Advertisement 4"> -->
        </div>

    </div>

    <!-- CENTER: MAIN VIDEO -->
    <div id="center-panel">

        <div id="main-video-wrapper">
            <video id="main-video" autoplay muted loop playsinline>
                <source src="videos\kitchen\emptyKitchen.mp4">
            </video>

            <div id="live-badge">🔴 LIVE</div>
            <div>Ethan</div>
        </div>

        <!-- THUMBNAILS -->
        <div id="thumb-grid">

            <!-- BATHROOM -->
            <video class="thumb" data-src="videos\bathRoom\Bathroomempty.mp4" muted></video>

            <!-- Kitchen -->
             <!-- <video class="thumb" data-src="videos/kitchen/EmptyKitchenBW.mp4" muted></video> -->
             <!-- <video class="thumb" data-src="videos\kitchen\walkAwayAfterTapeKitchen.mp4" muted></video> -->
             <video class="thumb" data-src="videos\kitchen\emptyKitchen.mp4" muted></video>



            <!-- FRIDGE -->
            <video class="thumb" data-src="videos\kitchen\fridgeEmpty.mp4" muted></video>

            <!-- BEDROOM -->
            <!-- <video class="thumb" data-src="videos\bedRoom\roomEmpty.mp4" muted></video> -->
             <!-- <video class="thumb" data-src="videos\bedRoom\Ethan getting ready for bed opening curtain.mp4" muted></video> -->
             <video class="thumb" data-src="videos\bedRoom\readyForBed.mp4" muted></video>

            <!-- LIVING ROOMS -->
            <!-- <video class="thumb" data-src="videos/livingRoom/emptylivingRoomBW.mp4" muted></video> -->
             <!-- <video class="thumb" data-src="videos\livingRoom\ethanWalklivingRoom.mp4" muted></video> -->
             <video class="thumb" data-src="videos\livingRoom\emptyLivingRoom.mp4" muted></video>
            

            <!-- OVER COUCH -->
            <video class="thumb" data-src="videos\livingRoom\top view of couch with added bars.mp4" muted></video>

            <!-- FRONT OF HOUSE -->
            <!-- <video class="thumb" data-src="videos\outside\frontOfHouse\frontEmpty.mp4" muted></video> -->
            <video class="thumb" data-src="videos\outside\frontOfHouse\View of outside after we hear the loud bang, creature getting up on the roof.mp4" muted></video>

            <!-- BACK OF HOUSE -->
            <!-- <video class="thumb" data-src="videos\outside\backOfHouse\View outside right after creeper moment.mp4" muted></video> -->
            <video class="thumb" data-src="videos\outside\backOfHouse\outsideNight.mp4" muted></video>
            

            <!-- SIDE OF HOUSE -->
            <!-- <video class="thumb" data-src="videos\outside\sideOfHouse\sideOfHouse.mp4" muted></video> -->
            <video class="thumb" data-src="videos\outside\sideOfHouse\sideDark.mp4" muted></video>

            <!-- <video class="thumb" data-src="videos/room0.mp4" muted></video> -->

        </div>



    </div>

    <!-- RIGHT: CHAT -->
    <div id="right-panel">

        <div id="chat-header">
            LIVE CHAT
        </div>

        <div id="chat-wrapper">
            <div id="chat"></div>
        </div>

        <div id="chat-input">
            <input id="chat-text" type="text" placeholder="Type a message..." />
            <button id="send-btn">Send</button>
        </div>

        <div id="side-image">
            <img src="images/smile.png" alt="film poster">
        </div>
    </div>


    

</div>

<script src="js/main.js"></script>

</body>
</html>
